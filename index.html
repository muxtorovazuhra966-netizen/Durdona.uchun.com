<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durdona ❤️</title>
<a href="https://Durdona.uchun.com">Durdona uchun</a>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
}
canvas { display:block; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let w,h,particles=[];
const name="DURDONA";

function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
  createHeart();
}

function heart(t){
  return {
    x:16*Math.pow(Math.sin(t),3),
    y:-(13*Math.cos(t)-5*Math.cos(2*t)
    -2*Math.cos(3*t)-Math.cos(4*t))
  };
}

function createHeart(){
  particles=[];
  const scale=Math.min(w,h)/38;

  for(let i=0;i<3000;i++){
    const t=Math.random()*Math.PI*2;
    const edge=heart(t);
    const fill=Math.sqrt(Math.random());

    particles.push({
      x:Math.random()*w,
      y:Math.random()*h,
      tx:w/2+edge.x*fill*scale,
      ty:h/2+edge.y*fill*scale,
      size:Math.random()*1.7+0.5,
      speed:0.025+Math.random()*0.025
    });
  }
}

function animate(){
  ctx.clearRect(0,0,w,h);

  for(const p of particles){
    p.x+=(p.tx-p.x)*p.speed;
    p.y+=(p.ty-p.y)*p.speed;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.shadowBlur=10;
    ctx.shadowColor="white";
    ctx.fill();
  }

  // Durdona yozuvi
  ctx.save();
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font="bold "+Math.max(25,Math.min(w/13,55))+"px Arial";
  ctx.shadowBlur=18;
  ctx.shadowColor="#ff4d88";
  ctx.fillStyle="#ff8ab5";
  ctx.fillText(name,w/2,h/2+5);
  ctx.restore();

  requestAnimationFrame(animate);
}

window.addEventListener("resize",resize);
resize();
animate();
</script>

</body>
</html>
